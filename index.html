<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0F1D17">
<title>Kitti किट्टी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --room:#0F1D17; --room-2:#15271F;
  --felt:#1F6B4C; --felt-d:#134A34; --wood:#161616; --wood-d:#000000; --wood-l:#2E2E2E;
  --prime:#22A06B; --prime-d:#126B43; --black:#141414;
  --gold:#FF6B5E; --gold-d:#9E2A20; --gold-ink:#FFFFFF; --red:#D7372B; --red-d:#801E16;
  --cream:#FFF4DC; --soft:rgba(255,244,220,.72);
  --cardbg:#FFFFFF; --cardink:#1B1B1B;
  --panel:#FFFFFF; --ink:#17211D; --muted:#5B6B64; --line:#DCE3DF; --gain:#1F7A47; --loss:#B3261E;
  --display:"Baloo 2","Mukta","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Mukta","Noto Sans Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#18241F; --ink:#E6EEEA; --muted:#9AAAA3; --line:#2B3934; --gain:#5BC88A; --loss:#F07A70; --cardbg:#F3F1EA; }
}
:root[data-theme="dark"]{ --panel:#18241F; --ink:#E6EEEA; --muted:#9AAAA3; --line:#2B3934; --gain:#5BC88A; --loss:#F07A70; --cardbg:#F3F1EA; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 60% at 50% 0%, var(--room-2), var(--room) 70%) fixed, var(--room)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3,.num{font-family:var(--display)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit;background:none}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.hidden{display:none !important}
.pos{color:var(--gain)} .neg{color:var(--loss)} .zero{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;display:flex;align-items:center;gap:8px}
.brand .s{font-size:15px;letter-spacing:1px;opacity:.9}
.brand .s i{font-style:normal}.brand .s .r{color:#FF8A7A}
.lang{border:1px solid rgba(255,244,220,.25);padding:5px 12px;border-radius:99px;font-weight:600;font-size:15px}
.lang:hover{background:rgba(255,244,220,.08)}

/* toolbar */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;background:rgba(255,244,220,.07);border:1px solid rgba(255,244,220,.12);border-radius:14px;font-size:13px;font-weight:600;line-height:1.15;text-align:center}
.tool:hover:not(:disabled){background:rgba(255,244,220,.13)}
.tool:disabled{opacity:.35}
.tool .ic{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;height:22px;display:grid;place-items:center}
.tool.warn .ic{color:#FF9A8C}

/* the table */
.table{position:relative;border-radius:30px;padding:12px 12px 14px;
  background:radial-gradient(110% 80% at 50% 25%, #2A8460 0%, var(--felt) 45%, var(--felt-d) 100%);
  border:10px solid var(--wood);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25), inset 0 0 40px rgba(0,0,0,.45), 0 0 0 2px var(--wood-d), 0 14px 30px rgba(0,0,0,.5);
  background-clip:padding-box}
.table::before{content:"";position:absolute;inset:-10px;border-radius:30px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 30%,transparent 70%,rgba(0,0,0,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:10px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tpill{background:rgba(0,0,0,.25);border-radius:99px;padding:3px 12px;font-size:15px;font-weight:600}
.tpill b{font-family:var(--display);font-weight:800;color:#fff}
.total{text-align:center;margin:6px 0 2px}
.total .lbl{font-size:15px;color:var(--soft)}
.total .amt{font-family:var(--display);font-weight:800;font-size:58px;line-height:1.02;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.total .amt small{font-size:26px;color:var(--soft);margin-right:6px}
.total .note{font-size:14px;color:var(--soft);min-height:1.3em}
.total .note b{color:#fff}
.total.bump .amt,.result.bump .won{animation:bump .45s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.hand.n5 .pc .nm{font-size:11px;letter-spacing:-.2px}.hand.n5 .pc .mid{padding-left:2px;padding-right:2px}.hand.n5 .pc .big{display:none}.hand.n5 .pc .amt{font-size:12px}

/* win result on the table */
.result{text-align:center;padding:6px 0 2px}
.result .trophy{font-size:15px;color:var(--soft)}
.result .who{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;color:#fff;margin-top:2px}
.result .won{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.05;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.result .won small{font-size:24px;margin-right:6px;opacity:.85}
.result .kind{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:0 10px;font-size:14px;font-weight:700;margin-top:4px}
.paylist{margin-top:12px;display:grid;gap:6px;text-align:left}
.brief{margin-top:10px;font-size:15px;color:var(--soft)}
.payrow{display:flex;justify-content:space-between;background:rgba(0,0,0,.22);border-radius:12px;padding:6px 12px;font-size:15px}
.payrow b{font-family:var(--display);color:#fff}
.b-next{width:100%;background:var(--prime);color:#fff;font-family:var(--display);font-weight:800;font-size:21px;padding:13px;box-shadow:0 3px 0 var(--prime-d)}
.b-wrap{width:100%;background:var(--black);color:#fff;border:1.5px solid rgba(255,255,255,.28);font-family:var(--display);font-weight:800;font-size:19px;padding:12px;line-height:1.1}
.b-wrap small{display:block;font-family:var(--body);font-weight:600;font-size:12px;opacity:.8}
.b-next:active{transform:translateY(2px)}
.tlist{margin-top:10px;display:grid;gap:6px}
.trow2{display:flex;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.trow2 b{font-family:var(--display)}
.tnote{color:var(--muted);font-size:14px;margin-top:8px}

/* cards: small enough that 5 fit in one row */
.pick{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px 2px}
.pick h2{margin:0;font-size:16px;color:var(--soft);font-weight:700}
.hand{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,86px));justify-content:center;gap:8px;padding-top:10px}
.taphint{font-size:13px;color:var(--soft);text-align:center;margin-top:10px}
.pc{position:relative;aspect-ratio:5/7;padding:0;background:var(--cardbg);color:var(--cardink);border-radius:10px;
  box-shadow:0 1px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.4);transition:transform .18s ease, box-shadow .18s ease;overflow:hidden}
.pc::after{content:"";position:absolute;inset:4px;border:1px solid rgba(0,0,0,.08);border-radius:7px;pointer-events:none}
.pc .cx{position:absolute;top:6px;left:7px;display:flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--display);font-weight:800}
.pc .cx .l{font-size:14px}.pc .cx .s{font-size:10px;margin-top:1px}
.pc .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 5px 6px;text-align:center}
.pc .big{font-size:22px;line-height:1}
.pc .nm{font-weight:700;font-size:13px;line-height:1.1;margin-top:5px;color:var(--cardink);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.pc .amt{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.1;margin-top:3px;color:var(--cardink);opacity:.8;white-space:nowrap}
.pc.red{color:var(--red)}
.pc[aria-checked="true"]{transform:translateY(-6px);box-shadow:0 0 0 3px var(--red),0 10px 20px rgba(0,0,0,.55)}
.pc[aria-checked="true"] .mid{padding-bottom:18px}
.pc .ribbon{position:absolute;left:0;right:0;bottom:0;background:var(--red);color:#fff;font-weight:800;font-size:11px;padding:1px 0;font-family:var(--display);display:none}
.pc[aria-checked="true"] .ribbon{display:block}
@media (prefers-reduced-motion: reduce){.pc{transition:none}.total.bump .amt{animation:none}.ov-card{animation:none}}

.deal{display:inline-block;margin-top:4px;background:rgba(255,244,220,.14);border-radius:99px;padding:2px 12px;font-size:14px;color:var(--cream)}
.deal b{color:#fff}

/* start-next-game overlay */
.ov{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-h,100dvh);z-index:9;background:rgba(4,10,7,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px}
.ov-card{position:relative;width:100%;max-width:420px;max-height:calc(var(--vv-h,100dvh) - 28px);overflow:auto;border-radius:24px;padding:16px 14px 12px;
  background:radial-gradient(110% 80% at 50% 20%,#2A8460 0%,var(--felt) 50%,var(--felt-d) 100%);border:8px solid var(--wood);box-shadow:0 0 0 2px var(--wood-d),0 20px 50px rgba(0,0,0,.6);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.ov-x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.28);font-size:17px;line-height:1;color:var(--cream)}
.ov .result{padding-top:2px}
.ov-sub{margin-top:14px;font-size:14px;color:var(--soft);text-align:center}
.ov-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ov-tools button{background:rgba(0,0,0,.28);border:1px solid rgba(255,244,220,.22);padding:9px 6px;font-weight:600;font-size:15px;color:var(--cream)}
.ov-tools button:disabled{opacity:.35}
.ov .b-next{margin-top:12px}
.ov .b-wrap{margin-top:8px}
.ov-undo{display:block;margin:8px auto 0;color:var(--gold);font-weight:700;font-size:15px;padding:4px 10px}

/* lower panels */
.sec-title{margin:28px 2px 8px;font-size:18px}
details.sec{background:var(--panel);color:var(--ink);border-radius:14px;margin-top:10px}
details.sec summary{list-style:none;padding:13px 14px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font-family:var(--display);font-size:22px;line-height:1;color:var(--muted)}
details.sec[open] summary::after{content:"−"}
.sec-body{padding:0 14px 8px}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.subh{font-weight:700;margin:8px 0 2px;color:var(--muted);font-size:15px}
.log .r{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.log .no{font-family:var(--display);font-weight:700;color:var(--muted)}
.log .what{font-weight:700}
.log .detail{color:var(--muted);font-size:15px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:0 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.badge.k{background:#F6D9A6;color:#3A2606}.badge.s{background:var(--red);color:#fff}.badge.i{background:var(--line);color:var(--ink);margin-left:0}
.empty{color:var(--muted);padding:9px 0;border-top:1px solid var(--line)}
.rules p,.rules li{color:var(--muted);font-size:15px}
.rules ul{padding-left:18px;margin:6px 0}
.tagleft{font-size:13px;color:var(--muted);margin-left:6px}

/* rail */
#game .wrap{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#262626 0%,#161616 14%,#080808 100%);border-top:3px solid var(--red);box-shadow:0 -8px 24px rgba(0,0,0,.45)}
.rail-in{max-width:560px;margin:0 auto}
.rail .msg{font-size:15px;text-align:center;margin-bottom:8px;min-height:1.4em;color:var(--cream)}
.rail .msg b{color:#fff}
.btns{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.btns button{font-family:var(--display);font-weight:800;padding:10px 4px;line-height:1.1;font-size:18px}
.btns small{display:block;font-family:var(--body);font-weight:600;font-size:12px;opacity:.85}
.btns.three{grid-template-columns:1fr 1fr 1.4fr}
.btns.four{grid-template-columns:1fr 1fr 1fr 1.25fr;gap:6px}
.btns.four button{font-size:16px}.btns.four small{font-size:11px}
.btns.wait{grid-template-columns:1fr 1.5fr}
.b-four{background:var(--black);color:#fff;border:1.5px solid var(--red);box-shadow:0 3px 0 #000}
.b-kitti{background:var(--black);color:#fff;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 3px 0 #000}
.b-four:disabled{opacity:.4;box-shadow:none}
.pick .rd{font-size:13px;font-weight:600;color:var(--soft);border:1px solid rgba(255,244,220,.25);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pick .rd:hover{background:rgba(255,244,220,.08)}
.result .kind.four,.badge.f{background:var(--black);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line) !important;padding:10px 12px;color:var(--ink)}
.tog b{display:block;font-weight:700}.tog small{display:block;color:var(--muted);font-size:14px;font-weight:400}
.sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tog[aria-checked="true"] .sw{background:var(--felt)}.tog[aria-checked="true"] .sw::after{transform:translateX(18px)}
.b-salami{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.b-win{background:var(--prime);color:#fff;font-size:22px !important;box-shadow:0 3px 0 var(--prime-d)}
.b-salami:disabled,.b-win:disabled{opacity:.4;box-shadow:none}
.btns button:active:not(:disabled){transform:translateY(2px)}

.fb{display:block;margin:22px auto 0;padding:8px 14px;color:var(--soft);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fb:hover{color:var(--cream)}
/* last action + undo: sits in the rail in place of the hint, so it never covers the table or buttons */
.toast{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:1.4em;padding:2px 4px 2px 10px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;line-height:1.3}
.toast button{color:var(--gold);font-weight:700;padding:4px 8px;white-space:nowrap}
.toast:not(.hidden) + .msg{display:none}

/* setup */
.panel{background:var(--panel);color:var(--ink);border-radius:18px;padding:18px}
.panel h1{font-size:26px;margin:0 0 2px;line-height:1.2}
.panel .lead{color:var(--muted);margin:0 0 18px}
.field{margin-bottom:16px}
label{display:block;font-weight:700;margin:0 0 6px}
.hint{color:var(--muted);font-size:15px;margin-top:6px}
.err{color:var(--loss);font-size:15px;margin-top:6px;min-height:1em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{height:54px;border:1.5px solid var(--line);font-family:var(--display);font-size:26px;font-weight:800;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--prime);border-color:var(--prime);color:#fff}
.total-hint{margin-top:8px;font-size:15px;color:var(--ink)}.total-hint b{font-family:var(--display);font-size:18px}
.names{display:grid;gap:8px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{color:var(--ink);border:1.5px solid var(--line);padding:4px 12px;font-weight:600;font-size:15px;border-radius:99px}
.quick button[aria-pressed="true"]{background:var(--prime);border-color:var(--prime);color:#fff}
.go{background:var(--prime);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;padding:12px 18px;width:100%;box-shadow:0 3px 0 var(--prime-d)}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--prime-d)}
/* settle up */
.st-img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin:4px 0 14px}
.st-btns{display:grid;gap:8px}
.st-btns button{width:100%}

/* sheets */
/* sheets sit inside the visible viewport, so the on-screen keyboard never covers them */
.scrim{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-h,100dvh);background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:calc(var(--vv-h,100dvh) - 24px);overflow:auto;overscroll-behavior:contain}
body.kb .sheet{padding-bottom:14px}
body.kb .sheet p{margin-bottom:8px}
body.kb .rail,body.kb .toast{visibility:hidden}
@media (max-width:380px){
  .wrap{padding:10px 10px 32px}
  .tools{gap:6px}.tool{font-size:12px;padding:8px 2px 6px}
  .total .amt{font-size:52px}.result .won{font-size:44px}.result .who{font-size:28px}
  .hand{gap:6px}.pc .big{font-size:19px}.pc .nm{font-size:12px}
  .btns button{font-size:16px}.b-win{font-size:20px !important}.btns.four button{font-size:14px}
  .two{gap:8px}
}
@media (max-height:560px){.total .amt{font-size:44px}.total{margin:6px 0 2px}}
.sheet h3{margin:0 0 4px;font-size:21px}
.sheet p{margin:0 0 14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ghost{color:var(--ink);border:1.5px solid var(--line);padding:11px 14px;font-weight:600}
.okb{background:var(--prime);color:#fff;font-weight:700;padding:11px 14px}
.okb:disabled{opacity:.4}
.danger{background:var(--loss);color:#fff;font-weight:700;padding:11px 14px}
.danger:disabled{opacity:.4}
.choose{display:grid;gap:8px}
.choose button{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);padding:10px 12px;color:var(--ink);text-align:left}
.choose button[aria-checked="true"]{border-color:var(--loss);background:rgba(179,38,30,.08)}
.choose .sm{color:var(--muted);font-size:14px}
.summary{background:rgba(0,0,0,.04);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:15px;min-height:1em}
.summary:empty{display:none}
</style>
</head>
<body>

<!-- SETUP -->
<section id="setup">
 <div class="wrap">
  <div class="top">
    <div class="brand"><span data-t="brand"></span><span class="s"><i>♠</i><i class="r">♥</i><i class="r">♦</i><i>♣</i></span></div>
    <button class="lang langBtn"></button>
  </div>
  <div class="panel">
    <h1 data-t="setupTitle"></h1>
    <p class="lead" data-t="setupLead"></p>
    <div class="field">
      <label data-t="players"></label>
      <div class="seg" id="seg" role="group"></div>
      <div class="hint" data-t="playersHint"></div>
    </div>
    <div class="field"><label data-t="names"></label><div class="names" id="names"></div></div>
    <div class="field">
      <label for="potIn" data-t="potLabel"></label>

<!-- GAME -->
<section id="game" class="hidden">
 <div class="wrap">
  <div class="top">

  const t = k => T[lang][k];

  /* ---------- storage ---------- */
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      let s = JSON.parse(localStorage.getItem(KEY) || "null");
      if(!s){
        const v2 = JSON.parse(localStorage.getItem(OLDKEYS[0]) || "null");
        const v1 = JSON.parse(localStorage.getItem(OLDKEYS[1]) || "null");
        if(v2 && Array.isArray(v2.players)) s = Object.assign({waiting:false}, v2);
        else if(v1 && Array.isArray(v1.players) && v1.pot > 0){
          s = {players:v1.players, seated:v1.players.map(()=>true), share:v1.pot/v1.players.length, events:[], waiting:false,
            rounds:(v1.rounds||[]).map(r => { const n = r.n || v1.players.length, pot = r.pot || v1.pot;
              return {type:r.type, winner:r.winner, share:pot/n, seated:Array.from({length:n},(_,i)=>i)}; })};
        }
      }
      if(s && Array.isArray(s.players) && Array.isArray(s.seated) && s.share > 0 && Array.isArray(s.rounds) && Array.isArray(s.events)) return s;
    }catch(e){}
    return null;
  }

  /* ---------- game logic ----------
     state.share = what each seated player puts on the table per game.
     round  = {type: win|salami|kitti, winner, share, seated:[player indexes]}
     events = join | leave | pot, each tagged with how many games had been played (before).
     bal[p] = how much p is up (+) or down (−) and still has to settle.
     put[p] = how much p has on the table right now (from Kitti games).

     Every seated player adds `share` each game. The table only empties on a win:
       Win:    winner collects everything on the table.
       Salami: winner collects the table, plus one extra share from every seated loser.
     Leaving:  the leaver settles bal with the other players now (cash), and pays their table money
               in equal parts to the players who stay, who keep it on the table for the next winner.
  */
  function splitEven(amount, n){
    if(n <= 0) return [];
    const whole = Math.abs(amount - Math.round(amount)) < 1e-9;
    if(whole){
      const total = Math.round(amount), base = Math.floor(total / n), rem = total - base * n;
      return Array.from({length:n}, (_,i) => base + (i < rem ? 1 : 0));
    }
    return Array.from({length:n}, () => amount / n);
  }
  // Payments when player p leaves, given current balances and table money. Returns per-player net (+ = p pays them).
  function leavePlan(bal, put, p, stayers){
    const net = {}, P = bal.length;
    const add = (q, a) => { net[q] = (net[q] || 0) + a; };
    let rem = bal[p];
    if(rem < -0.004){            // p owes: pay the players who are up
      const cr = []; for(let q = 0; q < P; q++) if(q !== p && bal[q] > 0.004) cr.push(q);
      cr.sort((a,b) => bal[b] - bal[a]);
      let owe = -rem;
      cr.forEach(q => { if(owe < 0.004) return; const a = Math.min(owe, bal[q]); add(q, a); owe -= a; });
    } else if(rem > 0.004){      // p is owed: collect from the players who are down
      const db = []; for(let q = 0; q < P; q++) if(q !== p && bal[q] < -0.004) db.push(q);
      db.sort((a,b) => bal[a] - bal[b]);
      let due = rem;
      db.forEach(q => { if(due < 0.004) return; const a = Math.min(due, -bal[q]); add(q, -a); due -= a; });
    }
    const scorePart = Object.assign({}, net);
    const tableParts = splitEven(put[p], stayers.length);
    stayers.forEach((q, k) => { if(tableParts[k] > 0) add(q, tableParts[k]); });
    return {net, scorePart, tableParts, stayers, table: put[p]};
  }

  function compute(s){
    const P = s.players.length, bal = new Array(P).fill(0), log = [], leaveInfo = {};
    let put = new Array(P).fill(0), kittis = 0;
    // seating at the start: everyone except players added later; events then replay joins and leaves
    const seat = new Array(P).fill(false);
    const joinedLater = new Set(s.events.filter(e => e.type === "join" && e.isNew).map(e => e.p));
    for(let p = 0; p < P; p++) seat[p] = !joinedLater.has(p);
    function applyEvents(i){
      s.events.forEach((e, k) => {
        if(e.before !== i) return;
        if(e.type === "join"){ seat[e.p] = true; }
        else if(e.type === "leave"){
          const stayers = []; for(let q = 0; q < P; q++) if(seat[q] && q !== e.p) stayers.push(q);
          const plan = leavePlan(bal, put, e.p, stayers);
          Object.keys(plan.scorePart).forEach(q => { const a = plan.scorePart[q]; bal[e.p] += a; bal[+q] -= a; });
          stayers.forEach((q, j) => { put[q] += plan.tableParts[j] || 0; });
          put[e.p] = 0; seat[e.p] = false;
          const total = Object.values(plan.net).reduce((a,b)=>a+b,0);
          leaveInfo[k] = {total};
        }
      });
    }
    s.rounds.forEach((r, i) => {
      applyEvents(i);
      r.seated.forEach(p => put[p] += r.share);
      const table = put.reduce((a,b)=>a+b,0);
      if(r.type === "kitti"){ kittis++; log.push({i, type:"kitti", table, breaker: r.breaker == null ? null : r.breaker}); return; }
      let total = 0, maxEach = 0; const pays = [];
      for(let p = 0; p < P; p++){
        if(p === r.winner) continue;
        const pay = put[p] + (r.type === "salami" && r.seated.includes(p) ? r.share : 0);
        if(pay <= 0.004) continue;
        bal[p] -= pay; total += pay; maxEach = Math.max(maxEach, pay); pays.push({p, pay});
      }
      bal[r.winner] += total;
      log.push({i, type:r.type, winner:r.winner, each:maxEach, total, pays});
      put = new Array(P).fill(0); kittis = 0;
    });
    applyEvents(s.rounds.length);

    const seated = s.seated.map((v,i)=>v?i:-1).filter(i=>i>=0), S = s.share;
    const onTable = put.map((v,i) => v + (s.seated[i] ? S : 0));
    const carry = put.reduce((a,b)=>a+b,0);
    const table = carry + S * seated.length;
    const preview = w => { let win = 0; for(let p = 0; p < P; p++) if(p !== w) win += onTable[p]; return {win, sal: win + S * (seated.length - 1)}; };
    return {P, S, bal, log, put, kittis, carry, table, onTable, preview, leaveInfo, seated};
  }
  function settlements(bal, names){
    const cr = [], db = [];
    bal.forEach((b,i) => { if(b > 0.004) cr.push({i,a:b}); else if(b < -0.004) db.push({i,a:-b}); });
    cr.sort((a,b)=>b.a-a.a); db.sort((a,b)=>b.a-a.a);
    const out = []; let c = 0, d = 0;
    while(c < cr.length && d < db.length){
      const amt = Math.min(cr[c].a, db[d].a);
      out.push({from:names[db[d].i], to:names[cr[c].i], amt});
      cr[c].a -= amt; db[d].a -= amt;
      if(cr[c].a < 0.004) c++; if(db[d].a < 0.004) d++;
    }
    return out;
  }

  /* ---------- game screen ---------- */
  function renderGame(bump){

      else if(e.type === "redeal") txt = t("evRedeal");
      else txt = t("evPot")(fmt(e.pot), fmt(e.share));
      items.push({at:e.before, o:0, k, html:'<div class="r"><div class="no"></div><div><span class="badge i">'+esc(txt)+'</span></div></div>'});
    });
    items.sort((a,b) => b.at - a.at || b.o - a.o || (b.k||0) - (a.k||0));
    $("log").innerHTML = items.length ? items.map(x=>x.html).join("") : '<div class="empty">'+t("noRounds")+'</div>';
    $("rules").innerHTML = t("rules")(fmt(g.S)).replace("</ul>", (fourOn() ? t("rFour") : "") + t("rRedeal") + "</ul>");
  }

  function record(type){
    const g = compute(state), names = state.players, r = digits(state.rounds.length + 1);
    let msg;
    // a Kitti with a card selected records that player as the one who broke the run
    const breaker = type === "kitti" ? selected : null;
    if(type === "kitti") msg = breaker !== null ? t("tKittiBy")(r, fmt(g.table), names[breaker]) : t("tKitti")(r, fmt(g.table));
    else { const pv = g.preview(selected); msg = type === "salami" ? t("tSalami")(r, names[selected], fmt(pv.sal)) : type === "four" ? t("tFour")(r, names[selected], fmt(pv.win)) : t("tWin")(r, names[selected], fmt(pv.win)); }
    const round = {type, winner: type === "kitti" ? null : selected, share: state.share, seated: seatedIdx()};
    if(type === "kitti" && breaker !== null) round.breaker = breaker;
    state.rounds.push(round);
    state.waiting = type !== "kitti"; act("round");
    selected = null; ovMin = false; save(); renderGame(true);
    if(type === "kitti") toast(msg); else $("toast").classList.add("hidden");   // the overlay shows the result
    window.scrollTo({top:0, behavior:"smooth"});
  }
  $("winBtn").onclick = () => { if(selected !== null) record("win"); };
  $("salamiBtn").onclick = () => { if(selected !== null) record("salami"); };
  $("fourBtn").onclick = () => { if(selected !== null && fourOn()) record("four"); };
  // four pairs: the deal is skipped and redone. No money moves and the game number stays the same.
  $("redealBtn").onclick = () => {
    state.events.push({type:"redeal", before:state.rounds.length}); act("event");
    selected = null; save(); renderGame(false);
    toast(t("tRedeal")(digits(state.rounds.length + 1)));
  };
  $("kittiBtn").onclick = () => record("kitti");
  function startNext(){
    state.waiting = false; ovMin = false; act("next"); save(); renderGame(true);
    toast(t("tNext")(digits(state.rounds.length + 1)));
    window.scrollTo({top:0, behavior:"smooth"});
  }
  $("nextBtn").onclick = startNext;
  $("ovNext").onclick = startNext;
  $("ovX").onclick = () => { ovMin = true; renderGame(false); };
  // wrap up: only offered after a win, so the table is empty and the scores are final
  function wrapUp(){ state.wrapped = true; save(); $("toast").classList.add("hidden"); show(); }
  $("wrapBtn").onclick = wrapUp;
  $("ovWrap").onclick = wrapUp;
  $("ovUndo").onclick = () => undo();
  $("ovAdd").onclick = () => $("tAdd").click();
  $("ovLeave").onclick = () => $("tLeave").click();

  /* one undo for the most recent action: a game, starting the next game, join, leave or pot change */
  function act(kind){ (state.actions = state.actions || []).push(kind); }
  function undo(){
    const a = (state.actions || []).pop();
    ovMin = false;
    if(a === "next") state.waiting = true;
    else if(a === "round"){ state.rounds.pop(); state.waiting = false; }
    else if(a === "event"){
      const last = state.events.pop();
      if(last.type === "join"){ if(last.isNew){ state.players.pop(); state.seated.pop(); } else state.seated[last.p] = false; }
      else if(last.type === "leave") state.seated[last.p] = true;
      else if(last.type === "pot") state.share = last.prevShare;
    }
    save(); renderGame(false); $("toast").classList.add("hidden");
  }
  function toast(msg){
    $("toastMsg").textContent = msg; $("toast").classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 5000);
  }
  $("toastUndo").onclick = undo;

  /* ---------- sheets ---------- */
  const open = id => $(id).classList.remove("hidden");
  const close = id => $(id).classList.add("hidden");
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => close(b.dataset.close));
  document.querySelectorAll(".scrim").forEach(sc => sc.onclick = e => { if(e.target === sc) close(sc.id); });
  document.addEventListener("keydown", e => { if(e.key === "Escape") document.querySelectorAll(".scrim").forEach(s => close(s.id)); });

  // add player
  $("tAdd").onclick = () => {
    $("addInfo").textContent = t("addInfo")(fmt(state.share)); $("addErr").textContent = "";
    $("addName").value = ""; $("addName").placeholder = t("player")(state.players.length + 1);
    open("sAdd"); $("addName").focus();
  };
  $("addOk").onclick = () => {
    const n = $("addName").value.trim();
    if(seatedIdx().length >= MAX){ $("addErr").textContent = t("addFull"); return; }
    if(!n){ $("addErr").textContent = t("errName"); return; }
    const ex = state.players.findIndex(p => p.toLowerCase() === n.toLowerCase());
    if(ex >= 0 && state.seated[ex]){ $("addErr").textContent = t("errName"); return; }
    let p, isNew = ex < 0;
    if(isNew){ state.players.push(n); state.seated.push(true); p = state.players.length - 1; }
    else { p = ex; state.seated[p] = true; }
    state.events.push({type:"join", p, isNew, before:state.rounds.length}); act("event");
    save(); close("sAdd"); renderGame(true); toast(t("tJoin")(state.players[p], fmt(potNow())));
  };
  $("addName").onkeydown = e => { if(e.key === "Enter") $("addOk").click(); };

  // pot
  function potHint(){
    const v = parseFloat($("potEdit").value), n = seatedIdx().length;
    $("potEach").innerHTML = v > 0 ? t("each")(fmt(v*n), digits(n), fmt(v)) : "";
    quickPicks($("quick2"), $("potEdit"), potHint);
  }
  $("tPot").onclick = () => { $("potEdit").value = r2(state.share); $("potErr").textContent = ""; potHint(); open("sPot"); $("potEdit").focus(); };
  $("potEdit").oninput = potHint;
  $("potOk").onclick = () => {
    const ns = parseFloat($("potEdit").value);
    if(!(ns > 0)){ $("potErr").textContent = t("errPot"); return; }
    if(Math.abs(ns - state.share) > 1e-9){
      state.events.push({type:"pot", pot:ns * seatedIdx().length, share:ns, prevShare:state.share, before:state.rounds.length});
      state.share = ns; act("event"); save(); renderGame(true);
    }
    close("sPot"); toast(t("tPot")(fmt(ns)));
  };
  $("potEdit").onkeydown = e => { if(e.key === "Enter") $("potOk").click(); };

  // leave: pick a player, show exactly who they pay, confirm payment
  function renderLeave(){
    const g = compute(state), names = state.players;
    $("leaveList").innerHTML = g.seated.map(i =>
      '<button role="radio" aria-checked="'+(leavePick===i)+'" data-i="'+i+'"><span>'+esc(names[i])+'</span><span class="sm">'+signed(g.bal[i])+'</span></button>').join("");
    $("leaveList").querySelectorAll("button").forEach(b => b.onclick = () => { leavePick = +b.dataset.i; renderLeave(); });
    if(g.seated.length <= MIN){ $("leaveSum").textContent = t("leaveMin"); $("leaveOk").disabled = true; return; }
    $("leaveOk").disabled = leavePick === null;
    if(leavePick === null){ $("leaveSum").innerHTML = ""; return; }
    const p = leavePick, stayers = g.seated.filter(q => q !== p);
    const plan = leavePlan(g.bal, g.put, p, stayers);
    const rows = Object.keys(plan.net).map(q => ({q:+q, a:plan.net[q]})).filter(x => Math.abs(x.a) > 0.004);
    if(!rows.length){ $("leaveSum").innerHTML = esc(t("lNothing")(names[p])) + '<div class="tnote">'+t("lConfirm")+'</div>'; return; }
    const total = rows.reduce((s,x)=>s+x.a,0);
    let h = (total >= 0 ? t("lTotalPay")(esc(names[p]), fmt(total)) : t("lTotalGet")(esc(names[p]), fmt(-total)));
    h += '<div class="tlist">' + rows.map(x => '<div class="trow2"><span>'+esc(x.a > 0 ? t("lPays")(names[p], names[x.q]) : t("lGets")(names[p], names[x.q]))+'</span><b>'+t("rs")+' '+fmt(Math.abs(x.a))+'</b></div>').join("") + '</div>';
    if(plan.table > 0.004) h += '<div class="tnote">'+t("lTable")(fmt(plan.table))+'</div>';
    h += '<div class="tnote">'+t("lConfirm")+'</div>';
    $("leaveSum").innerHTML = h;
  }
  $("tLeave").onclick = () => { leavePick = null; renderLeave(); open("sLeave"); };
  $("leaveOk").onclick = () => {
    if(leavePick === null || seatedIdx().length <= MIN) return;
    const p = leavePick;
    state.seated[p] = false; state.events.push({type:"leave", p, before:state.rounds.length}); act("event");
    if(selected === p) selected = null;
    save(); close("sLeave"); renderGame(true); toast(t("tLeave")(state.players[p]));
  };

  // reset
  $("tReset").onclick = () => { if(!state.rounds.length && !state.events.length) doReset(); else open("sReset"); };
  $("resetOk").onclick = doReset;
  function doReset(){
    close("sReset");
    const seated = seatedIdx().map(i => state.players[i]);
    draftNames = seated.concat(["","","","",""]).slice(0, MAX);
    count = Math.max(MIN, Math.min(seated.length, MAX)); $("potIn").value = r2(state.share);
    draftFour = !!(state.rules && state.rules.four);
    state = null; selected = null; $("toast").classList.add("hidden");
    try{ localStorage.removeItem(KEY); OLDKEYS.forEach(k => localStorage.removeItem(k)); }catch(e){}
    show();
  }

  function show(){
    const playing = !!state && !state.wrapped, wrapped = !!state && !!state.wrapped;
    $("setup").classList.toggle("hidden", !!state);
    $("game").classList.toggle("hidden", !playing);
    $("settle").classList.toggle("hidden", !wrapped);
    if(!playing) $("ov").classList.add("hidden");   // the result overlay sits outside #game
    applyText();
    if(wrapped) renderSettle(); else if(playing) renderGame(false); else renderSetup();
    window.scrollTo(0,0);
  }

  /* ---------- settle up: a shareable image of the final tally ---------- */
  let stBlob = null;
  function stFile(){ const d = new Date(), z = n => String(n).padStart(2,"0"); return "kitti-settle-up-"+d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+".png"; }
  function drawSettle(){
    const g = compute(state), names = state.players;
    const order = names.map((n,i)=>({n, i, b:g.bal[i]})).sort((a,b)=>b.b-a.b);
    const sts = settlements(g.bal, names);
    const W = 1080, PAD = 72, ROW = 128, HEAD = 300;
    const H = HEAD + 10 + 94 + order.length*ROW + 150;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const x = cv.getContext("2d");
    const disp = '"Baloo 2","Mukta","Segoe UI",sans-serif', body = '"Mukta","Noto Sans Devanagari","Segoe UI",sans-serif';
    // paper
    x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, W, H);
    // green felt header with a black rim and a red line
    const gr = x.createRadialGradient(W/2, 60, 40, W/2, 120, W*.7);
    gr.addColorStop(0, "#2A8460"); gr.addColorStop(1, "#134A34");
    x.fillStyle = gr; x.fillRect(0, 0, W, HEAD);
    x.fillStyle = "#D7372B"; x.fillRect(0, HEAD, W, 10);
    x.fillStyle = "#141414"; x.fillRect(0, H - 24, W, 24);
    x.textBaseline = "alphabetic";
    x.fillStyle = "#FFFFFF"; x.font = "800 84px " + disp; x.textAlign = "left";
    x.fillText(t("imgTitle"), PAD, 140);
    // suits: black and red
    const suits = [["♠","#141414"],["♥","#D7372B"],["♦","#D7372B"],["♣","#141414"]];
    x.font = "700 56px " + body; x.textAlign = "right";
    let sx = W - PAD;
    for(let k = suits.length - 1; k >= 0; k--){ x.fillStyle = suits[k][1]; x.fillText(suits[k][0], sx, 132); sx -= 62; }
    x.textAlign = "left"; x.fillStyle = "rgba(255,244,220,.85)"; x.font = "500 38px " + body;
    const d = new Date().toLocaleDateString(lang === "ne" ? "ne-NP" : "en-GB", {day:"numeric", month:"long", year:"numeric"});
    x.fillText(d + "  ·  " + t("imgGames")(digits(state.rounds.length)), PAD, 210);
    x.fillText(t("rs") + " " + fmt(state.share) + " × " + digits(g.seated.length), PAD, 262);

    let y = HEAD + 10 + 70;
    const heading = txt => { x.fillStyle = "#134A34"; x.font = "800 44px " + disp; x.textAlign = "left"; x.fillText(txt, PAD, y); y += 24; };
    const line = () => { x.fillStyle = "#DCE3DF"; x.fillRect(PAD, y, W - PAD*2, 2); };
    // one table: each player's score, with who they pay (or collect from) underneath
    const fit = (txt, max, font, size) => {
      let s2 = size; x.font = font + " " + s2 + "px " + body;
      while(x.measureText(txt).width > max && s2 > 22){ s2 -= 2; x.font = font + " " + s2 + "px " + body; }
      return s2;
    };
    const detail = o => {
      if(!state.seated[o.i] && Math.abs(o.b) < 0.005) return t("settled");
      if(o.b < -0.004) return t("payTo")(sts.filter(s2 => s2.from === o.n).map(s2 => t("payItem")(s2.to, fmt(s2.amt))).join(", "));
      if(o.b > 0.004){
        const from = sts.filter(s2 => s2.to === o.n).map(s2 => s2.from);
        const full = t("getFrom")(from.join(", "));
        x.font = "500 30px " + body;
        return x.measureText(full).width > W - PAD*2 - 300 ? t("getFromN")(digits(from.length)) : full;
      }
      return t("squareP");
    };
    heading(t("scoresTitle"));
    order.forEach(o => {
      line(); y += 58;
      const color = o.b > 0.004 ? "#1F7A47" : o.b < -0.004 ? "#B3261E" : "#5B6B64";
      x.textAlign = "left"; x.fillStyle = "#17211D"; fit(o.n, W - PAD*2 - 300, "700", 42); x.fillText(o.n, PAD, y);
      x.textAlign = "right"; x.fillStyle = color; x.font = "800 46px " + disp; x.fillText(signed(o.b), W - PAD, y + 14);
      const dt = detail(o);
      x.textAlign = "left"; x.fillStyle = "#5B6B64"; fit(dt, W - PAD*2 - 300, "500", 30); x.fillText(dt, PAD, y + 44);
      y += ROW - 58;
    });
    line();
    x.textAlign = "center"; x.fillStyle = "#9AAAA3"; x.font = "500 30px " + body;
    x.fillText(t("imgFoot"), W/2, H - 60);
    return cv;
  }
  function renderSettle(){
    stBlob = null;
    const paint = () => {
      const cv = drawSettle();
      $("stImg").src = cv.toDataURL("image/png");
      $("stImg").alt = t("settleTitle");
      cv.toBlob(b => {
        stBlob = b;
        let canShare = false;
        try{ canShare = !!(b && navigator.canShare && navigator.canShare({files:[new File([b], stFile(), {type:"image/png"})]})); }catch(e){}
        $("stShare").classList.toggle("hidden", !canShare);
      }, "image/png");
    };
    // wait for the web fonts so the image uses them
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(paint, paint); else paint();
  }
  $("stDown").onclick = () => {
    const a = document.createElement("a");
    a.download = stFile();
    a.href = stBlob ? URL.createObjectURL(stBlob) : $("stImg").src;
    document.body.appendChild(a); a.click(); a.remove();
    if(stBlob) setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  $("stShare").onclick = () => {
    if(!stBlob) return;
    const f = new File([stBlob], stFile(), {type:"image/png"});
    navigator.share({files:[f], title:t("imgTitle")}).catch(() => {});
  };
  $("stBack").onclick = () => { state.wrapped = false; save(); show(); };
  $("stNew").onclick = () => { if(confirm(t("confirmNew"))) doReset(); };
  /* keep sheets above the on-screen keyboard (works in Chrome, Safari and in-app browsers like Messenger) */
  function fitViewport(){
    const vv = window.visualViewport, root = document.documentElement;
    const h = vv ? vv.height : window.innerHeight, top = vv ? vv.offsetTop : 0;
    root.style.setProperty("--vv-h", h + "px");
    root.style.setProperty("--vv-top", top + "px");
    const a = document.activeElement;
    const typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
    document.body.classList.toggle("kb", !!typing && h < window.innerHeight * 0.85 || !!typing && !vv);
  }
  if(window.visualViewport){
    visualViewport.addEventListener("resize", fitViewport);
    visualViewport.addEventListener("scroll", fitViewport);
  }
  window.addEventListener("resize", fitViewport);
  document.addEventListener("focusin", e => {
    fitViewport();
    const el = e.target;
    if(el.tagName !== "INPUT") return;
    // after the keyboard opens, bring the field (and the buttons under it) into view
    setTimeout(() => { fitViewport(); el.scrollIntoView({block:"center", behavior:"smooth"}); }, 300);
  });
  document.addEventListener("focusout", () => setTimeout(fitViewport, 100));
  fitViewport();

  /* visitor stats (GoatCounter: no cookies, no personal data) */
  if(GOATCOUNTER){
    const gc = document.createElement("script");
    gc.async = true; gc.src = "https://gc.zgo.at/count.js";
    gc.dataset.goatcounter = "https://" + GOATCOUNTER + ".goatcounter.com/count";
    document.head.appendChild(gc);
  }
  /* feedback: opens the Tally form with a few details filled in (Tally hidden fields) */
  document.querySelectorAll(".fb").forEach(b => {
    b.classList.toggle("hidden", !FEEDBACK_URL);
    b.onclick = () => {
      const screen = !state ? "setup" : state.wrapped ? "settle" : "game";
      const q = new URLSearchParams({lang, screen, players: state ? String(seatedIdx().length) : String(count),
        games: state ? String(state.rounds.length) : "0", device: navigator.userAgent.slice(0, 180)});
      window.open(FEEDBACK_URL + (FEEDBACK_URL.includes("?") ? "&" : "?") + q, "_blank", "noopener");
    };
  });

  state = load(); show();
})();
</script>
</body>
</html>
